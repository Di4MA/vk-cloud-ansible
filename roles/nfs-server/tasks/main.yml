---

- name: Install NFS server
  apt:
    name: nfs-kernel-server
    state: present
    update_cache: yes

- name: Create shared directory
  file:
    path: /srv/nfs/share
    state: directory
    owner: nobody
    group: nogroup
    mode: '0777'

- name: Configure exports
  copy:
    dest: /etc/exports
    content: |
      /srv/nfs/share 10.0.0.0/24(rw,sync,no_subtree_check,no_root_squash)

- name: Apply exportfs
  command: exportfs -a

- name: Restart NFS
  service:
    name: nfs-kernel-server
    state: restarted
    enabled: yes