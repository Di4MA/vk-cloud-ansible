---

- name: Update apt cache (Debian/Ubuntu)
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install required packages
  package:
    name:
      - freeipa-server
      - chrony
    state: present

- name: Start and enable chrony
  service:
    name: chrony
    state: started
    enabled: yes

- name: Disable firewall (lab only)
  service:
    name: ufw
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Set hostname (FQDN)
  hostname:
    name: "{{ inventory_hostname }}.optik.com"

- name: Ensure hostname persists
  copy:
    dest: /etc/hostname
    content: "{{ inventory_hostname }}.optik.com\n"

- name: Configure /etc/hosts (lab setup)
  blockinfile:
    path: /etc/hosts
    block: |
      10.0.0.10 vm0.optik.com vm0
      10.0.0.11 vm1.optik.com vm1
      10.0.0.12 vm2.optik.com vm2

- name: Install FreeIPA Server
  command: >
    ipa-server-install
    --unattended
    --domain=optik.com
    --realm=OPTIK.COM
    --ds-password=Admin123
    --admin-password=Admin123
    --setup-dns
    --no-forwarders
  args:
    creates: /etc/ipa/default.conf